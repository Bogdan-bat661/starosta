<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Староста</title>
<style>
:root{--bg:#f3f1ec;--card:#fff;--tx:#1b1d21;--mut:#6b7078;--bd:#dedbd3;--ac:#1d4ed8;--acx:#fff;--ok:#16794a;--no:#b42318;--late:#a15c00;--okb:#dcf3e6;--nob:#fde4e1;--lateb:#fdeccc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1e2126;--tx:#eef0f3;--mut:#9aa1ab;--bd:#2d3239;--ac:#7aa2ff;--acx:#0b1220;--ok:#6fdc9f;--no:#ff9b91;--late:#f5c36a;--okb:#143726;--nob:#43201d;--lateb:#402e0c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1e2126;--tx:#eef0f3;--mut:#9aa1ab;--bd:#2d3239;--ac:#7aa2ff;--acx:#0b1220;--ok:#6fdc9f;--no:#ff9b91;--late:#f5c36a;--okb:#143726;--nob:#43201d;--lateb:#402e0c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;max-width:560px;margin-inline:auto;padding:12px 14px 40px}
h1{font-size:22px;margin:4px 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:11px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
input,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:140px}
.row{display:flex;gap:8px;margin-bottom:8px}
.row>*{flex:1}.row>.sm{flex:0 0 90px}
.btn{padding:11px 14px;border:0;border-radius:10px;background:var(--ac);color:var(--acx);font:inherit;font-weight:600;width:100%}
.btn.ghost{background:transparent;color:var(--ac);border:1px solid var(--bd)}
.pair{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pair b{display:block}.mut{color:var(--mut);font-size:14px}
.st{display:flex;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--bd)}
.st:first-of-type{border-top:0}
.st .n{flex:1;min-width:0;overflow-wrap:anywhere}
.st button{padding:8px 9px;border:1px solid var(--bd);background:var(--bg);color:var(--mut);border-radius:8px;font:inherit;font-size:15px}
.st button.ok.on{background:var(--okb);color:var(--ok);border-color:var(--ok)}
.st button.no.on{background:var(--nob);color:var(--no);border-color:var(--no)}
.st button.late.on{background:var(--lateb);color:var(--late);border-color:var(--late)}
.x{background:none!important;border:0!important;color:var(--no)!important;font-size:20px!important}
pre{white-space:pre-wrap;font:inherit;background:var(--bg);padding:10px;border-radius:10px;border:1px solid var(--bd)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<h1>Староста</h1>
<div class="tabs"><button id="t-day">Пари</button><button id="t-st">Студенти</button></div>
<div id="app"></div>
<script>
try{var tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand()}}catch(e){}
var KEY='starosta-v1',S={students:[],days:{}},tab='day',openId=null,report='';
try{var r=localStorage.getItem(KEY);if(r){var p=JSON.parse(r);S.students=p.students||[];S.days=p.days||{}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
var date=ymd(new Date());
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pairs(){return S.days[date]||(S.days[date]=[])}
function label(){var d=new Date(date+'T12:00:00');return d.toLocaleDateString('uk-UA',{weekday:'long',day:'numeric',month:'long'})}
function render(){
 document.getElementById('t-day').className=tab==='day'?'on':'';
 document.getElementById('t-st').className=tab==='st'?'on':'';
 var h='';
 if(tab==='st'){
  h+='<div class="card"><div class="mut" style="margin-bottom:8px">Додайте студентів, по одному в рядок</div><textarea id="bulk" placeholder="Іваненко Олена&#10;Петренко Макс"></textarea><div style="height:8px"></div><button class="btn" data-a="addbulk">Додати до списку</button></div>';
  h+='<div class="card">'+(S.students.length?S.students.map(function(n,i){return'<div class="st"><span class="n">'+esc(n)+'</span><button class="x" data-a="delst" data-i="'+i+'" aria-label="Видалити">✕</button></div>'}).join(''):'<span class="mut">Список порожній</span>')+'</div>';
 } else {
  h+='<div class="row"><input type="date" id="dt" value="'+date+'"></div><div class="mut" style="margin:0 0 10px">'+esc(label())+'</div>';
  h+='<div class="card"><div class="row"><input id="tm" class="sm" placeholder="09:00"><input id="nm" placeholder="Назва пари"></div><button class="btn" data-a="addpair">Додати пару</button></div>';
  var ps=pairs();
  if(!ps.length)h+='<div class="mut">На цей день пар немає. Додайте першу.</div>';
  ps.forEach(function(pr,pi){
   var c={ok:0,no:0,late:0};Object.keys(pr.att).forEach(function(k){if(c[pr.att[k]]!==undefined)c[pr.att[k]]++});
   h+='<div class="card"><div class="pair"><div><b>'+esc(pr.time)+' '+esc(pr.name)+'</b><span class="mut">Є '+c.ok+' · немає '+c.no+' · запізнюються '+c.late+'</span></div><button class="btn ghost" style="width:auto" data-a="open" data-i="'+pr.id+'">'+(openId===pr.id?'Згорнути':'Відмітити')+'</button></div>';
   if(openId===pr.id){
    h+='<div style="margin-top:8px">'+(S.students.length?S.students.map(function(n){var v=pr.att[n];return'<div class="st"><span class="n">'+esc(n)+'</span>'+[['ok','Є'],['no','Нема'],['late','Спіз.']].map(function(o){return'<button class="'+o[0]+(v===o[0]?' on':'')+'" data-a="set" data-p="'+pr.id+'" data-n="'+esc(n)+'" data-v="'+o[0]+'">'+o[1]+'</button>'}).join('')+'</div>'}).join(''):'<span class="mut">Спочатку додайте студентів у вкладці «Студенти».</span>')+'<div style="height:8px"></div><button class="btn ghost" data-a="delpair" data-i="'+pr.id+'">Видалити пару</button></div>';
   }
   h+='</div>';
  });
  if(ps.length){h+='<button class="btn" data-a="report">Скласти звіт для чату</button>';if(report)h+='<div style="height:10px"></div><pre id="rep">'+esc(report)+'</pre><button class="btn ghost" data-a="copy">Скопіювати</button>'}
 }
 document.getElementById('app').innerHTML=h;
}
function makeReport(){
 var t='Відвідування, '+label()+'\n';
 pairs().forEach(function(pr){
  var g={ok:[],no:[],late:[],none:[]};
  S.students.forEach(function(n){g[pr.att[n]||'none'].push(n)});
  t+='\n'+pr.time+' '+pr.name+'\nНемає: '+(g.no.join(', ')||'—')+'\nЗапізнюються: '+(g.late.join(', ')||'—')+'\n';
  if(g.none.length)t+='Не відмічені: '+g.none.join(', ')+'\n';
 });
 return t.trim();
}
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-a]');
 if(e.target.id==='t-day'){tab='day';render();return}
 if(e.target.id==='t-st'){tab='st';render();return}
 if(!b)return;var a=b.dataset.a;
 if(a==='addbulk'){var v=document.getElementById('bulk').value.split('\n').map(function(s){return s.trim()}).filter(Boolean);v.forEach(function(n){if(S.students.indexOf(n)<0)S.students.push(n)});save()}
 if(a==='delst'){S.students.splice(+b.dataset.i,1);save()}
 if(a==='addpair'){var nm=document.getElementById('nm').value.trim(),tm=document.getElementById('tm').value.trim();if(!nm)return;pairs().push({id:'p'+Date.now(),time:tm,name:nm,att:{}});pairs().sort(function(x,y){return x.time<y.time?-1:1});save()}
 if(a==='open'){openId=openId===b.dataset.i?null:b.dataset.i}
 if(a==='set'){var pr=pairs().filter(function(x){return x.id===b.dataset.p})[0];var n=b.dataset.n;if(pr.att[n]===b.dataset.v)delete pr.att[n];else pr.att[n]=b.dataset.v;save()}
 if(a==='delpair'){S.days[date]=pairs().filter(function(x){return x.id!==b.dataset.i});openId=null;save()}
 if(a==='report'){report=makeReport()}
 if(a==='copy'){try{navigator.clipboard.writeText(report).then(function(){b.textContent='Скопійовано'},function(){b.textContent='Виділіть текст і скопіюйте вручну'})}catch(x){b.textContent='Виділіть текст і скопіюйте вручну'};return}
 render();
});
document.addEventListener('change',function(e){if(e.target.id==='dt'&&e.target.value){date=e.target.value;openId=null;report='';render()}});
render();
</script>
</body>
</html>
